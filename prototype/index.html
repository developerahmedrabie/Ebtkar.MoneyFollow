<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoneyFollow Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --phone:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --text:#14181f; --muted:#6b7280; --line:#e5e7eb;
  --primary:#0e7c66; --primary-soft:#d9f0ea; --on-primary:#ffffff;
  --income:#15803d; --income-soft:#dcfce7; --expense:#d9344b; --expense-soft:#fde4e8; --warn:#b86e00; --warn-soft:#fdf0d5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07090c; --phone:#0f1216; --surface:#181c22; --surface-2:#222831; --text:#eef1f5; --muted:#98a2b3; --line:#2a313b;
    --primary:#34c3a1; --primary-soft:#123a32; --on-primary:#062019;
    --income:#4ade80; --income-soft:#123522; --expense:#fb7185; --expense-soft:#3d1520; --warn:#fbbf24; --warn-soft:#3a2a0a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#07090c; --phone:#0f1216; --surface:#181c22; --surface-2:#222831; --text:#eef1f5; --muted:#98a2b3; --line:#2a313b;
  --primary:#34c3a1; --primary-soft:#123a32; --on-primary:#062019;
  --income:#4ade80; --income-soft:#123522; --expense:#fb7185; --expense-soft:#3d1520; --warn:#fbbf24; --warn-soft:#3a2a0a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* phone frame */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{position:relative;width:390px;height:844px;background:var(--phone);border-radius:44px;overflow:hidden;
  box-shadow:0 0 0 10px #1b1f24,0 30px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
@media (max-width:500px){
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:18px 16px 110px;display:none}
.screen.active{display:block}
.screen::-webkit-scrollbar{display:none}
.pane{display:none}.pane.on{display:block}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px;gap:10px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.icon-btn svg{width:20px;height:20px}
.month{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month button{width:30px;height:30px;border-radius:999px;display:grid;place-items:center}
.month button svg{width:16px;height:16px}
.month button:hover{background:var(--surface-2)}
.month button:disabled{opacity:.3;cursor:default}
.month span{min-width:104px;text-align:center;font-weight:600;font-size:14px}

/* cards */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{background:linear-gradient(135deg,#0e7c66,#0b5f7c);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}
.hero .lbl{opacity:.8;font-size:13px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.01em;margin:2px 0 16px}
.hero .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .pill{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hero .pill b{display:block;font-size:16px;margin-top:2px}
.hero .rate{margin-top:12px;font-size:12.5px;opacity:.9;color:#fff;display:block}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px;gap:8px}
.sec h2{font-size:16px;font-weight:650}
.link{color:var(--primary);font-weight:600;font-size:13px}

/* rows */
.tx,.row{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:start}
.tx{border-radius:12px}
.tx:hover{background:var(--surface-2)}
.tx+.tx,.row+.row,.tx+.row,.row+.tx{border-top:1px solid var(--line);border-radius:0}
.cat-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.mid{flex:1;min-width:0}
.mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.amt{font-weight:650;white-space:nowrap}
.inc{color:var(--income)} .exp{color:var(--expense)}
.day{color:var(--muted);font-size:12.5px;font-weight:600;margin:16px 4px 6px;display:flex;justify-content:space-between}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.mini{padding:7px 11px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-weight:650;font-size:12.5px;white-space:nowrap;flex:none}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--expense-soft);color:var(--expense)}
.chip.ok{background:var(--primary-soft);color:var(--primary)}

/* segmented + search */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.search{width:100%;margin:12px 0 0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.search:focus{border-color:var(--primary)}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.bud{display:flex;gap:12px;align-items:center;padding:10px 0}
.bud+.bud{border-top:1px solid var(--line)}
.bud .r1{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px;gap:8px}
.bud .r2{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:5px;gap:8px}
.bud input{width:100px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:end}

/* stats */
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{display:block;font-size:17px}
.donut .c small{color:var(--muted);font-size:11.5px}
.legend{flex:1;display:grid;gap:7px;font-size:13px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend em{font-style:normal;color:var(--muted)}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:150px;gap:8px;margin-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bars .pair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bars .pair i{width:11px;border-radius:4px 4px 2px 2px;min-height:2px;display:block}
.bars .stack{width:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .stack i{width:100%;border-radius:0}
.bars .stack i:first-child{border-radius:4px 4px 0 0}
.bars .stack i:last-child{border-radius:0 0 2px 2px}
.bars .col small{color:var(--muted);font-size:11px;white-space:nowrap}
.bars .col.cur small{color:var(--text);font-weight:700}
.keys{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.keys i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi.flat{box-shadow:none;background:var(--surface-2)}
.kpi small{color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:17px;margin-top:2px}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--muted);gap:10px}
.kv b{color:var(--text);font-weight:600}
.fc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.fc-h b{font-size:16px}
.fc-note{margin-top:10px;font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6;padding:0 4px}

/* settings list */
.list .item{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;gap:10px}
.list .item+.item{border-top:1px solid var(--line)}
.list select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:650;text-align:center}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface-2)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:var(--expense-soft);color:var(--expense)}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:8px 6px 0;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding-top:4px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--primary);font-weight:600}
.nav .fab{width:56px;height:56px;border-radius:18px;background:var(--primary);color:var(--on-primary);margin:-22px auto 0;
  display:grid;place-items:center;box-shadow:0 8px 20px rgba(14,124,102,.35);padding:0}
.nav .fab svg{width:26px;height:26px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:24px 24px 0 0;z-index:11;
  transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet:not(.open){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px}
.sheet .body{overflow-y:auto;padding:8px 18px 22px}
.sheet h3{font-size:18px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center}
.amount{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:18px 0 6px}
.amount input{width:200px;border:0;background:none;outline:none;font-size:42px;font-weight:700;text-align:center}
.cur-pick{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 8px;font-weight:600;color:var(--muted);font-size:15px}
.conv-hint{text-align:center;color:var(--muted);font-size:13px;min-height:18px}
.amt{text-align:end}
.conv{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.rate{display:flex;align-items:center;gap:8px;color:var(--muted)}
.rate input{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:end;color:var(--text)}
.field-lbl{color:var(--muted);font-size:12.5px;font-weight:600;margin:16px 2px 8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:14px;font-size:11.5px;border:2px solid transparent;background:var(--surface-2);text-align:center}
.cats button.on{border-color:var(--primary);background:var(--primary-soft)}
.cats .cat-ic{width:34px;height:34px;font-size:17px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);outline:none}
.inp:focus{border-color:var(--primary)}
.err{color:var(--expense);font-size:13px;min-height:18px;margin-top:8px;text-align:center}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;
  font-size:13.5px;font-weight:600;opacity:0;transition:.2s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* family */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.av.sm{width:24px;height:24px;font-size:13px}
.av.lg{width:52px;height:52px;font-size:28px}
.who{display:inline-flex;align-items:center;gap:3px}
.fam-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:8px}
.fam-strip::-webkit-scrollbar,.mem-pick::-webkit-scrollbar{display:none}
.fam-strip button{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border-radius:16px;padding:12px 4px;box-shadow:var(--shadow);font-size:12.5px}
.fam-strip button span{max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam-strip b{font-size:13px}
.mem-pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mem-pick button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 6px;padding-inline-end:12px;border-radius:99px;background:var(--surface-2);border:2px solid transparent;font-size:13px;font-weight:600;white-space:nowrap}
.mem-pick button.on{border-color:var(--primary);background:var(--primary-soft)}
.share{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.bars .bv{font-size:10.5px;color:var(--muted);font-style:normal;white-space:nowrap}
.bars .stack.wide{width:24px}
.fcg{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:10px 12px;align-items:center;font-size:13px}
.fcg .h{color:var(--muted);font-size:12px;text-align:end;font-weight:600}
.fcg .v{text-align:end;font-weight:600}
.fcg .v.hi{color:var(--warn)}
.fcg .nm{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcg .tot{border-top:1px solid var(--line);padding-top:10px}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{width:46px;height:46px;border-radius:50%;font-size:24px;background:var(--surface-2);border:2px solid transparent}
.avs button.on{border-color:var(--primary);background:var(--primary-soft)}
/* categories */
.avs.ics button{border-radius:14px;font-size:22px;width:44px;height:44px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px transparent}
.swatches button.on{box-shadow:0 0 0 2px var(--text)}
.cat-prev{display:flex;flex-direction:column;align-items:center;gap:6px;margin:2px 0 4px;font-weight:700}
.cat-prev .cat-ic{width:56px;height:56px;font-size:28px;border-radius:18px}
.lock{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.fcm+.fcm{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.fcm .items{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* occasions */
.bars .pair i.pred{background:repeating-linear-gradient(45deg,var(--warn) 0 4px,var(--warn-soft) 4px 8px)!important;outline:1.5px dashed var(--warn);outline-offset:-1.5px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}
.switch span::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::after{inset-inline-start:21px}
.src-note{color:var(--muted);font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="phone">
  <div class="screens">

    <!-- HOME -->
    <section class="screen active" id="s-home">
      <div class="top">
        <div><div class="sub" data-i18n="app_sub"></div><h1>MoneyFollow</h1></div>
        <div class="actions">
          <button class="icon-btn" id="lang-toggle" aria-label="Language"></button>
          <button class="icon-btn" data-go="more" data-i18n-aria="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
      </div>
      <div style="display:flex;justify-content:center;margin-bottom:14px"><div class="month" data-month></div></div>
      <div class="hero" id="hero"></div>
      <div class="sec"><h2 data-i18n="family"></h2><button class="link" data-go="fam" data-i18n="view_all"></button></div>
      <div class="fam-strip" id="home-fam"></div>
      <div class="sec" style="margin-top:12px"><h2 data-i18n="coming_up"></h2><button class="link" data-go="plan" data-tab="rec" data-i18n="view_all"></button></div>
      <div class="card" id="home-upcoming"></div>
      <div class="sec"><h2 data-i18n="budgets"></h2><button class="link" data-go="plan" data-tab="bud" data-i18n="manage"></button></div>
      <div class="card" id="home-budgets"></div>
      <div class="sec"><h2 data-i18n="recent"></h2><button class="link" data-go="tx" data-i18n="see_all"></button></div>
      <div class="card" id="home-recent" style="padding:6px 12px"></div>
    </section>

    <!-- TRANSACTIONS -->
    <section class="screen" id="s-tx">
      <div class="top"><h1 data-i18n="transactions"></h1><div class="month" data-month></div></div>
      <div class="seg" id="tx-filter">
        <button class="on" data-f="all" data-i18n="all"></button><button data-f="expense" data-i18n="expenses"></button><button data-f="income" data-i18n="income"></button>
      </div>
      <input class="search" id="tx-search" data-i18n-ph="search" type="search">
      <div class="mem-pick" id="tx-mem" style="margin-top:10px"></div>
      <div id="tx-list"></div>
    </section>

    <!-- FAMILY -->
    <section class="screen" id="s-fam">
      <div class="top"><button class="icon-btn" data-go="home" data-i18n-aria="back">

function dueSoon(days){

// mem: undefined = everyone, null = whole-family items only, id = one member
function forecast(n,mem){
  const thisM=TODAY.slice(0,7);
  const past=[1,2,3].map(k=>shiftMonth(thisM,-k));
  // occasion spending is predicted separately, so it is left out of the day-to-day average
  const varAvg=past.reduce((a,m)=>a+inMonth(m).filter(x=>x.type==='expense'&&!x.recId&&!x.ev&&ofMem(x,mem)).reduce((s,x)=>s+baseOf(x),0),0)/3;
  const months=[...Array(n)].map((_,i)=>{
    const m=shiftMonth(thisM,i+1); let fixed=0,inc=0,evExp=0; const odd=[], items=[], evs=[];
    state.rec.filter(r=>ofMem(r,mem)).forEach(r=>occurrences(r,m+'-01',m+'-31').forEach(()=>{
      const v=toBase(r.amount,r.cur);
      if(r.type==='expense'){ fixed+=v; if(!items.includes(r)) items.push(r); if(r.freq==='quarterly'||r.freq==='yearly') odd.push(r); } else inc+=v;
    }));
    evIds().forEach(id=>evDates(id).filter(d=>d.startsWith(m)).forEach(()=>{ const p=predict(id,mem).total; if(p>0){ evExp+=p; evs.push(id); } }));
    return {m,fixed,varEst:varAvg,evExp,evs,total:fixed+varAvg+evExp,inc,odd,items};
  });
  const avg=months.reduce((a,x)=>a+x.total,0)/n;
  months.forEach(x=>x.high = x.total>avg*1.05 && (x.odd.length>0||x.evs.length>0));
  return {varAvg,months,avg};
}

// spending per past occurrence, from expenses tagged with the occasion
function evHistory(id,mem){
  const occ=evDates(id); if(!occ.length) return [];
  const by={};
  state.tx.forEach(x=>{ if(x.ev!==id||x.type!=='expense'||!ofMem(x,mem)) return;
    const o=nearestOcc(occ,x.date), v=baseOf(x), h=by[o]||(by[o]={date:o,total:0,cats:{},mems:{},txs:[]});
    h.total+=v; h.cats[x.cat]=(h.cats[x.cat]||0)+v; const mk=memKey(x.mem??null); h.mems[mk]=(h.mems[mk]||0)+v; h.txs.push(x); });

// expected = last occurrence x average year-over-year change of the last 3 occurrences (clamped)
const _pred={};
function predict(id,mem){
  const key=id+'|'+(mem===undefined?'*':memKey(mem)); if(_pred[key]) return _pred[key];
  const nxt=nextOcc(id);
  const hist=evHistory(id,mem).filter(o=>!nxt||o.date<nxt).slice(-3);
  let g=1;
  if(hist.length>1){ const r=[]; for(let i=1;i<hist.length;i++) if(hist[i-1].total>0) r.push(hist[i].total/hist[i-1].total);
    if(r.length) g=Math.min(1.5,Math.max(.85,r.reduce((a,b)=>a+b,0)/r.length)); }
  const last=hist[hist.length-1];
  return _pred[key]={total:last?last.total*g:0,last,hist,g};
}
async function syncEvents(){
  const btn=$('#ev-sync'); if(btn){ btn.disabled=true; btn.textContent=t('ev_syncing'); }
  const y0=Number(TODAY.slice(0,4))-3, y1=y0+4, out={}, push=(id,d)=>{ const y=Number(d.slice(0,4)); if(y>=y0&&y<=y1)(out[id]=out[id]||[]).push(d); };
  const jobs=[]; let holidayData=false;
  // Islamic occasions: convert the Hijri date to Gregorian (works for every country)
  Object.entries(EVENTS).filter(([,e])=>e.src==='hijri').forEach(([id,e])=>{
    for(let hy=y0-580;hy<=y1-578;hy++) jobs.push(fetch(`https://api.aladhan.com/v1/hToG/${pad(e.hd)}-${pad(e.hm)}-${hy}`).then(r=>r.json())
      .then(j=>{ const [dd,mm,yy]=j.data.gregorian.date.split('-'); push(id,`${yy}-${mm}-${dd}`); }));
  });
  // country public holidays
  for(let y=y0;y<=y1;y++) jobs.push(fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/${state.country}`).then(r=>r.ok?r.json():[]).then(list=>{
    if(list.length) holidayData=true;
    Object.entries(EVENTS).forEach(([id,e])=>{ if(e.src!=='holiday') return; const h=list.find(h=>e.match.test(h.name)); if(h) push(id,h.date); });
  }));
  const res=await Promise.allSettled(jobs), ok=res.filter(r=>r.status==='fulfilled').length;
  if(!ok){ toast(t('ev_sync_fail')); renderAll(); return; }
  Object.keys(EVENTS).forEach(id=>{ if(EVENTS[id].src==='holiday') delete state.evDates[id]; });
  let n=0; for(const id in out){ state.evDates[id]=[...new Set(out[id])].sort(); n+=state.evDates[id].length; }
  state.evCountry=state.country; state.evSync=ymd(new Date()); save(); renderAll();
  toast(holidayData?t('ev_synced',{n}):t('ev_no_holiday'));
}

function suggestEv(date){

}

  // keep the history: move this member's transactions and recurring items to the whole family
  state.tx.forEach(x=>{ if(x.mem===id) x.mem=null; }); state.rec.forEach(r=>{ if(r.mem===id) r.mem=null; });
  state.members=state.members.filter(m=>m.id!==id); if(txMem===String(id)) txMem='all';
  save(); closeSheet(); renderAll(); go('fam'); toast(t('t_mem_deleted'));
});

/* ================= categories ================= */
let catType='expense', cEditing=null, cType='expense', cIcon=CAT_ICONS[0], cColor=CAT_COLORS[0];
function renderCats(){
  $$('#cat-type button').forEach(b=>b.classList.toggle('on',b.dataset.ct===catType));
  const uses={}; state.tx.forEach(x=>uses[x.cat]=(uses[x.cat]||0)+1);
  const sub=id=>uses[id]?t('used_n',{n:uses[id]}):t('not_used');
  const mine=state.cats.filter(c=>c.type===catType);
  $('#cat-mine').innerHTML=mine.length?mine.map(c=>`<button class="tx" data-cedit="${c.id}">${icon(c.id)}
      <span class="mid"><div class="t">${esc(c.name)}</div><div class="s">${sub(c.id)}</div></span><span class="lock">${chevR}</span></button>`).join('')
    :`<div class="empty">${t('no_my_cats')}</div>`;
  $('#cat-built').innerHTML=CATS[catType].map(c=>`<div class="tx">${icon(c.id)}
      <span class="mid"><div class="t">${c[state.lang]}</div><div class="s">${sub(c.id)}</div></span><span class="lock">🔒 ${t('builtin')}</span></div>`).join('');
  $('#set-catcount').textContent=t('n_cats',{b:CATS.expense.length+CATS.income.length,c:state.cats.length});
}
function openCatSheet(c){
  cEditing=c||null; cType=c?c.type:catType; cIcon=c?c.icon:CAT_ICONS[0];
  cColor=c?c.color:CAT_COLORS[state.cats.length%CAT_COLORS.length];
  $('#c-title').textContent=t(c?'edit_cat':'new_cat');
  $('#c-name').value=c?c.name:''; $('#c-name').placeholder=t('cat_ph');
  $('#c-type-wrap').style.display=c?'none':'block';   // type is fixed once created
  $('#c-err').textContent=''; $('#c-hint').textContent=c?t('del_cat_hint'):'';
  const d=$('#c-del'); d.style.display=c?'block':'none'; d.textContent=t('del_cat'); d.dataset.confirm='';
  syncCatSheet(); $('#scrim').classList.add('open'); $('#csheet').classList.add('open');
  if(!c) setTimeout(()=>$('#c-name').focus({preventScroll:true}),260);
}
function syncCatSheet(){
  $$('#c-type button').forEach(b=>b.classList.toggle('on',b.dataset.t===cType));
  $('#c-icons').innerHTML=CAT_ICONS.map(i=>`<button data-ci="${i}" class="${i===cIcon?'on':''}">${i}</button>`).join('');
  $('#c-colors').innerHTML=CAT_COLORS.map(c=>`<button data-cc="${c}" class="${c===cColor?'on':''}" style="background:${c}" aria-label="${c}"></button>`).join('');
  const nm=$('#c-name').value.trim()||t('cat_ph').replace(/^.*?:\s*/,'');
  $('#c-prev').innerHTML=`<span class="cat-ic" style="background:${soft(cColor)}">${cIcon}</span><span>${esc(nm)}</span>`;
}
$('#cat-type').addEventListener('click',e=>{const b=e.target.closest('[data-ct]'); if(b){catType=b.dataset.ct; renderCats();}});
$('#cat-add').addEventListener('click',()=>openCatSheet());
$('#cat-mine').addEventListener('click',e=>{const b=e.target.closest('[data-cedit]'); if(b) openCatSheet(state.cats.find(c=>c.id===b.dataset.cedit));});
$('#c-type').addEventListener('click',e=>{const b=e.target.closest('[data-t]'); if(b){cType=b.dataset.t; syncCatSheet();}});
$('#c-icons').addEventListener('click',e=>{const b=e.target.closest('[data-ci]'); if(b){cIcon=b.dataset.ci; syncCatSheet();}});
$('#c-colors').addEventListener('click',e=>{const b=e.target.closest('[data-cc]'); if(b){cColor=b.dataset.cc; syncCatSheet();}});
$('#c-name').addEventListener('input',()=>{ $('#c-err').textContent=''; syncCatSheet(); });
$('#c-close').addEventListener('click',closeSheet);
$('#c-save').addEventListener('click',()=>{
  const name=$('#c-name').value.replace(/\s+/g,' ').trim();
  if(!name) return $('#c-err').textContent=t('err_name');
  const norm=s=>s.trim().toLowerCase();
  // names must be unique within the type, including the built-in names in both languages
  const taken=[...CATS[cType].flatMap(c=>[c.en,c.ar]),...state.cats.filter(c=>c.type===cType&&c!==cEditing).map(c=>c.name)];
  if(taken.some(n=>norm(n)===norm(name))) return $('#c-err').textContent=t('err_cat_dup');
  if(cEditing) Object.assign(cEditing,{name,icon:cIcon,color:cColor});
  else state.cats.push({id:'c'+(state.nextCat++),type:cType,name,icon:cIcon,color:cColor});
  catType=cType; save(); closeSheet(); renderAll(); toast(t('t_cat_saved'));
});
$('#c-del').addEventListener('click',()=>{
  const b=$('#c-del'); if(!cEditing) return;
  if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent=t('tap_again'); setTimeout(()=>{ if(b.dataset.confirm==='1'){ b.dataset.confirm=''; b.textContent=t('del_cat'); } },2500); return; }
  const id=cEditing.id, other=cEditing.type==='expense'?'other_e':'other_i';
  // keep history: move everything in this category to "Other"
  state.tx.forEach(x=>{ if(x.cat===id) x.cat=other; }); state.rec.forEach(r=>{ if(r.cat===id) r.cat=other; });
  delete state.budgets[id];
  state.cats=state.cats.filter(c=>c.id!==id);
  save(); closeSheet(); renderAll(); toast(t('t_cat_deleted'));
});

/* ================= settings ================= */
function applyTheme(){ if(state.theme) document.documentElement.dataset.theme=state.theme; else delete document.documentElement.dataset.theme; }
$('#set-lang').addEventListener('change',e=>{state.lang=e.target.value; save(); renderAll();});
$('#set-currency').addEventListener('change',e=>{state.base=e.target.value; save(); renderAll();});
$('#rates').addEventListener('change',e=>{
  const i=e.target.closest('[data-rate]'); if(!i) return;
  const v=Number(i.value.replace(/,/g,''));
  if(v>0){ state.rates[i.dataset.rate]=v*state.rates[state.base]; save(); renderAll(); toast(t('rates_updated')); } else renderMore();
});
$('#set-theme').addEventListener('change',e=>{state.theme=e.target.value; save(); applyTheme();});
$('#reset').addEventListener('click',()=>{const th=state.theme, lg=state.lang; state=demo(lg); state.theme=th; save(); renderAll(); toast(t('t_reset'));});
$('#export').addEventListener('click',()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['date','type','category','amount','currency','amount_'+state.base,'account','member','occasion','note','recurring'],...[...state.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.type,q(catText(x.cat)),x.amount,x.cur,Math.round(baseOf(x)*100)/100,q(t('acc_'+x.acc)),q(memName(memById(x.mem??null))),x.ev?q(evName(x.ev)):'',q(txName(x)),x.recId?'yes':''])];
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));
  a.download='moneyfollow-transactions.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});

let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1800); }

applyTheme(); renderAll();
</script>
</body>
</html>
